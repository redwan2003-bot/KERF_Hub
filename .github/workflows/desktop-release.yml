name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Monorepo Dependencies
        run: pnpm install
        working-directory: kerf-hub

      - name: Build Web App Assets
        run: pnpm --filter @kerf/web build
        working-directory: kerf-hub

      - name: Build Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./kerf-hub/apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'KERF Hub ${{ github.ref_name }}'
          releaseBody: 'Production release for KERF Hub desktop application.'
          releaseDraft: false
          prerelease: false
