name: Firmware Matrix CI

on:
  push:
    paths:
      - 'zmk-config-byrantk_lp63/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'zmk-config-byrantk_lp63/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build ByranTK LP63 Firmware
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache West modules
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            zmk-config-byrantk_lp63/modules/
            zmk-config-byrantk_lp63/tools/
            zmk-config-byrantk_lp63/zephyr/
            zmk-config-byrantk_lp63/bootloader/
            zmk-config-byrantk_lp63/zmk/
          key: ${{ runner.os }}-zmk-${{ hashFiles('zmk-config-byrantk_lp63/**/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-zmk-

      - name: Initialize West Workspace
        working-directory: zmk-config-byrantk_lp63
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build LP63 Firmware
        working-directory: zmk-config-byrantk_lp63
        run: |
          west build -s zmk/app -b nice_nano_v2 -- -DSHIELD=byrantk_lp63 -DZMK_CONFIG="$(pwd)/config"

      - name: Archive UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: byrantk_lp63-nice_nano_v2-zmk
          path: zmk-config-byrantk_lp63/build/zephyr/zmk.uf2
