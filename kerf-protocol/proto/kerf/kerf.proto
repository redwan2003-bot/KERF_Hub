syntax = "proto3";
package kerf;

import "kerf/core.proto";
import "kerf/lighting.proto";
import "kerf/macros.proto";
import "kerf/profiles.proto";
import "kerf/display.proto";
import "kerf/power.proto";
import "kerf/pointer.proto";

enum ErrorCode {
  OK = 0;
  LOCKED = 1;
  UNSUPPORTED = 2;
  INVALID = 3;
  NO_SPACE = 4;
  BUSY = 5;
}

message Request {
  uint32 request_id = 1;
  oneof subsystem {
    core.Request     core     = 10;
    lighting.Request lighting = 11;
    macros.Request   macros   = 12;
    profiles.Request profiles = 13;
    display.Request  display  = 14;
    power.Request    power    = 15;
    pointer.Request  pointer  = 16;
  }
}

message Response {
  uint32 request_id = 1;
  ErrorCode error = 2;
  oneof subsystem {
    core.Response     core     = 10;
    lighting.Response lighting = 11;
    macros.Response   macros   = 12;
    profiles.Response profiles = 13;
    display.Response  display  = 14;
    power.Response    power    = 15;
    pointer.Response  pointer  = 16;
  }
}

message Notification {
  oneof subsystem {
    core.Notification     core     = 10;
    lighting.Notification lighting = 11;
    macros.Notification   macros   = 12;
    profiles.Notification profiles = 13;
    display.Notification  display  = 14;
    power.Notification    power    = 15;
    pointer.Notification  pointer  = 16;
  }
}
