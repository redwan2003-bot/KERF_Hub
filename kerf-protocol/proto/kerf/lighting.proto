syntax = "proto3";
package kerf.lighting;

message UnderglowConfig {
  bool on = 1;
  uint32 hue = 2;         // 0 - 360
  uint32 saturation = 3;  // 0 - 100
  uint32 brightness = 4;  // 0 - 100
  uint32 effect = 5;      // 0 = solid, 1 = breathe, 2 = spectrum, 3 = rainbow
  uint32 speed = 6;       // 1 - 5
  bool auto_off_idle = 7;
  bool auto_off_usb = 8;
}

message BatledConfig {
  uint32 brightness = 1;     // 0 - 100
  uint32 low_brightness = 2; // 0 - 100
  uint32 tap_ms = 3;         // Duration in ms on short tap (default 1000)
  uint32 max_hold_ms = 4;    // Maximum hold duration in ms (default 10000)
  uint32 low_percent = 5;    // Low battery warning threshold (default 10%)
  uint32 repeat_min = 6;     // Low battery repeat interval in minutes (default 5)
}

message GetLightingStateRequest {}

message GetLightingStateResponse {
  UnderglowConfig underglow = 1;
  BatledConfig batled = 2;
}

message SetUnderglowConfigRequest {
  UnderglowConfig underglow = 1;
}

message SetUnderglowConfigResponse {}

message SetBatledConfigRequest {
  BatledConfig batled = 1;
}

message SetBatledConfigResponse {}

message Request {
  oneof command {
    GetLightingStateRequest   get_state      = 1;
    SetUnderglowConfigRequest set_underglow  = 2;
    SetBatledConfigRequest    set_batled     = 3;
  }
}

message Response {
  oneof result {
    GetLightingStateResponse   get_state      = 1;
    SetUnderglowConfigResponse set_underglow  = 2;
    SetBatledConfigResponse    set_batled     = 3;
  }
}

message Notification {
  oneof event {
    GetLightingStateResponse state_changed = 1;
  }
}
