---
include:
  # 1. Standalone keyboard with nice!view (Central, ZMK Studio enabled)
  - board: nice_nano//zmk
    shield: byrantk_lp63 nice_view
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  # 2. Keyboard as peripheral (BLE split, Studio disabled)
  - board: nice_nano//zmk
    shield: byrantk_lp63 nice_view
    snippet: byrantk-lp63-as-peripheral
    cmake-args: -DCONFIG_ZMK_STUDIO=n

  # 3. nice!nano as BLE dongle (Central, ZMK Studio enabled)
  - board: nice_nano//zmk
    shield: byrantk_lp63_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  # 4. kerf_dongle (nRF52833) as BLE dongle (Central, ZMK Studio enabled)
  - board: kerf_dongle
    shield: byrantk_lp63_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
