---
include:
  # 1. Keyboard as ESB peripheral with nice!view (ESB split, Studio disabled)
  - board: nice_nano//zmk
    shield: byrantk_lp63 nice_view
    snippet: byrantk-lp63-esb
    cmake-args: -DCONFIG_ZMK_STUDIO=n

  # 2. nice!nano as ESB dongle (Central, ZMK Studio enabled)
  - board: nice_nano//zmk
    shield: byrantk_lp63_esb_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y

  # 3. kerf_dongle (nRF52833) as ESB dongle (Central, ZMK Studio enabled)
  - board: kerf_dongle
    shield: byrantk_lp63_esb_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
